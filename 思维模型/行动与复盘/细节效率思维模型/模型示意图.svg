<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">细节效率思维模型示意图</title><desc id="desc">局部动作更快，不自动等于完整任务更快</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">细节效率思维模型</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用主题参考，非作者模型原图</text><text x="480" y="131" text-anchor="middle" fill="#18324a" font-size="26" font-weight="600">观察从申请到合格结果的完整过程</text><rect x="45" y="177" width="175" height="95" rx="4" fill="#dceefa"/><text x="132.5" y="233" text-anchor="middle" fill="#18324a" font-size="26" font-weight="600">操作</text><rect x="220" y="177" width="350" height="95" rx="4" fill="#fff0d8"/><text x="395.0" y="233" text-anchor="middle" fill="#18324a" font-size="26" font-weight="600">等待</text><rect x="570" y="177" width="170" height="95" rx="4" fill="#fbe1e1"/><text x="655.0" y="233" text-anchor="middle" fill="#18324a" font-size="26" font-weight="600">返工</text><rect x="740" y="177" width="175" height="95" rx="4" fill="#dff2e7"/><text x="827.5" y="233" text-anchor="middle" fill="#18324a" font-size="26" font-weight="600">交付</text><path d="M55 330 L905 330" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><text x="480" y="367" text-anchor="middle" fill="#18324a" font-size="25" font-weight="400">总耗时与质量一起看</text><text x="480" y="408" text-anchor="middle" fill="#53697a" font-size="22" font-weight="400">挑一处摩擦试改，再检查下游有没有多出工作</text><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">局部动作更快，不自动等于完整任务更快</text></g></svg>