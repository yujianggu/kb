<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">KISS复盘模型示意图</title><desc id="desc">分类后选少量行动；下次先检验执行结果。保留 Keep；改进 Improve；停止 Stop；开始 Start</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4776a4"/></marker></defs><rect width="960" height="480" rx="22" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="480" y="57" font-size="34" text-anchor="middle" fill="#172b4d">KISS复盘模型</text><rect x="80" y="130" width="345" height="98" rx="16" fill="#dcefe7" stroke="#b8cadf"/><text x="252.5" y="188.0" font-size="27" text-anchor="middle" fill="#172b4d">保留 Keep</text><rect x="535" y="130" width="345" height="98" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="707.5" y="188.0" font-size="27" text-anchor="middle" fill="#172b4d">改进 Improve</text><rect x="80" y="255" width="345" height="98" rx="16" fill="#fff0d6" stroke="#b8cadf"/><text x="252.5" y="313.0" font-size="27" text-anchor="middle" fill="#172b4d">停止 Stop</text><rect x="535" y="255" width="345" height="98" rx="16" fill="#eee5f6" stroke="#b8cadf"/><text x="707.5" y="313.0" font-size="27" text-anchor="middle" fill="#172b4d">开始 Start</text><text x="480" y="443" font-size="23" text-anchor="middle" fill="#172b4d">分类后选少量行动；下次先检验执行结果</text></g></svg>