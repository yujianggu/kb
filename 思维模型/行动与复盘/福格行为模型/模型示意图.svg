<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">福格行为模型示意图</title><desc id="desc">三者需在同一时刻具备；B=MAP不是数值乘法。动机 M；容易做到 A；提示 P；具体行为 B</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4776a4"/></marker></defs><rect width="960" height="480" rx="22" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="480" y="57" font-size="34" text-anchor="middle" fill="#172b4d">福格行为模型</text><rect x="65" y="125" width="220" height="85" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="175.0" y="176.5" font-size="25" text-anchor="middle" fill="#172b4d">动机 M</text><path d="M175 215 L480 300" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="370" y="125" width="220" height="85" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="480.0" y="176.5" font-size="25" text-anchor="middle" fill="#172b4d">容易做到 A</text><path d="M480 215 L480 300" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="675" y="125" width="220" height="85" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="785.0" y="176.5" font-size="25" text-anchor="middle" fill="#172b4d">提示 P</text><path d="M785 215 L480 300" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="335" y="315" width="290" height="80" rx="16" fill="#dcefe7" stroke="#b8cadf"/><text x="480.0" y="364.0" font-size="27" text-anchor="middle" fill="#172b4d">具体行为 B</text><text x="480" y="447" font-size="22" text-anchor="middle" fill="#172b4d">三者需在同一时刻具备；B=MAP不是数值乘法</text></g></svg>