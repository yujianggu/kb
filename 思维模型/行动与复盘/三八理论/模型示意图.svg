<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">三八理论示意图</title><desc id="desc">参考主题：时间预算与工作休息平衡</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">三八理论</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用主题参考，非作者模型原图</text><text x="480" y="130" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">真实记录 → 可用容量 → 安排承诺</text><rect x="45" y="195" width="255" height="105" rx="6" fill="#dceefa"/><text x="172.5" y="253" text-anchor="middle" fill="#18324a" font-size="21" font-weight="600">工作／上课</text><rect x="300" y="195" width="165" height="105" rx="6" fill="#fff0d8"/><text x="382.5" y="253" text-anchor="middle" fill="#18324a" font-size="21" font-weight="600">生活责任</text><rect x="465" y="195" width="230" height="105" rx="6" fill="#dff2e7"/><text x="580.0" y="253" text-anchor="middle" fill="#18324a" font-size="21" font-weight="600">休息恢复</text><rect x="695" y="195" width="145" height="105" rx="6" fill="#dceefa"/><text x="767.5" y="253" text-anchor="middle" fill="#18324a" font-size="21" font-weight="600">自主活动</text><rect x="840" y="195" width="75" height="105" rx="6" fill="#e5e9ed"/><text x="877.5" y="253" text-anchor="middle" fill="#18324a" font-size="18" font-weight="600">缓冲</text><text x="480" y="350" text-anchor="middle" fill="#18324a" font-size="25" font-weight="400">各项不能重复占用同一段时间</text><text x="480" y="389" text-anchor="middle" fill="#53697a" font-size="22" font-weight="400">区块仅示意，不规定人人相同的比例</text><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">参考主题：时间预算与工作休息平衡</text></g></svg>