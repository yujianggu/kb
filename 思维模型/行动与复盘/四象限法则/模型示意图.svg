<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">四象限法则示意图</title><desc id="desc">列：紧迫／不紧迫；行：重要／不重要。尽快处置；提前安排；协商简化；减少消耗</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4776a4"/></marker></defs><rect width="960" height="480" rx="22" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="480" y="57" font-size="34" text-anchor="middle" fill="#172b4d">四象限法则</text><text x="480" y="100" font-size="22" text-anchor="middle" fill="#172b4d">列：紧迫／不紧迫；行：重要／不重要</text><rect x="130" y="130" width="335" height="105" rx="16" fill="#dcefe7" stroke="#b8cadf"/><text x="297.5" y="191.5" font-size="27" text-anchor="middle" fill="#172b4d">尽快处置</text><rect x="495" y="130" width="335" height="105" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="662.5" y="191.5" font-size="27" text-anchor="middle" fill="#172b4d">提前安排</text><rect x="130" y="255" width="335" height="105" rx="16" fill="#fff0d6" stroke="#b8cadf"/><text x="297.5" y="316.5" font-size="27" text-anchor="middle" fill="#172b4d">协商简化</text><rect x="495" y="255" width="335" height="105" rx="16" fill="#eee5f6" stroke="#b8cadf"/><text x="662.5" y="316.5" font-size="27" text-anchor="middle" fill="#172b4d">减少消耗</text><text x="480" y="430" font-size="24" text-anchor="middle" fill="#172b4d">分类随对象和情境变化，不是永久标签</text></g></svg>