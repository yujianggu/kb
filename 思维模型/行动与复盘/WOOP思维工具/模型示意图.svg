<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">WOOP思维工具示意图</title><desc id="desc">如果内在障碍出现，那么执行具体应对。愿望 W；结果 O；障碍 O；计划 P</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4776a4"/></marker></defs><rect width="960" height="480" rx="22" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="480" y="57" font-size="34" text-anchor="middle" fill="#172b4d">WOOP思维工具</text><rect x="68.0" y="185" width="185" height="110" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="160.5" y="249.0" font-size="26" text-anchor="middle" fill="#172b4d">愿望 W</text><path d="M255.0 240 L277.0 240" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="281.0" y="185" width="185" height="110" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="373.5" y="249.0" font-size="26" text-anchor="middle" fill="#172b4d">结果 O</text><path d="M468.0 240 L490.0 240" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="494.0" y="185" width="185" height="110" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="586.5" y="249.0" font-size="26" text-anchor="middle" fill="#172b4d">障碍 O</text><path d="M681.0 240 L703.0 240" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="707.0" y="185" width="185" height="110" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="799.5" y="249.0" font-size="26" text-anchor="middle" fill="#172b4d">计划 P</text><text x="480" y="368" font-size="23" text-anchor="middle" fill="#172b4d">如果内在障碍出现，那么执行具体应对</text></g></svg>