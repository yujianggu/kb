<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">机会成本示意图</title><desc id="desc">有限资源；选择 A；放弃最佳替代 B。概念示意，非统计图。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#486478" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f3f7fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#19354a"><text x="40" y="56" font-size="32" font-weight="700">机会成本</text><rect x="70" y="218" width="250" height="90" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="195.0" y="272.0" font-size="24" text-anchor="middle">有限资源</text><rect x="460" y="143" width="435" height="90" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="677.5" y="197.0" font-size="24" text-anchor="middle">选择 A</text><rect x="460" y="303" width="435" height="90" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="677.5" y="357.0" font-size="24" text-anchor="middle">放弃最佳替代 B</text><path d="M335 245 L443 188" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><path d="M335 283 L443 348" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="438" font-size="21" text-anchor="middle">只计算最佳可行替代，不把所有未选项相加</text></g></svg>