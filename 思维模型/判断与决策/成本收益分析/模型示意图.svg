<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<rect width="1400" height="1000" fill="#f5f7fa"/>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#17384d}.h{font-size:38px;font-weight:600}.m{font-size:25px;font-weight:600}.s{font-size:22px}.n{font-size:19px;fill:#52677b}</style>
<text x="60" y="70" class="h" text-anchor="start">成本收益分析：投入是否值得，取决于口径与假设</text>
<text x="60" y="110" class="n" text-anchor="start">企业项目应用 · 金额、时间、证据一起看 | 本库制作</text>
<rect x="60" y="145" width="1280" height="70" rx="12" fill="#dce8f3"/>
<text x="700" y="189" class="m" text-anchor="middle">先定基准与方案：与谁比较、看谁的收益、比较几年？</text>
<rect x="60" y="240" width="625" height="200" rx="12" fill="#e4ebf5"/>
<text x="85" y="284" class="m" text-anchor="start">投入：现金与资源分别列</text>
<text x="85" y="331" class="s" text-anchor="start">一次性建设、集成与迁移</text>
<text x="85" y="369" class="s" text-anchor="start">持续运维、运营与培训</text>
<text x="85" y="407" class="s" text-anchor="start">人员占用、替换与退出</text>
<rect x="715" y="240" width="625" height="200" rx="12" fill="#dceee7"/>
<text x="740" y="284" class="m" text-anchor="start">收益：性质与证据分别列</text>
<text x="740" y="331" class="s" text-anchor="start">现金支出减少 → 核实是否少支付</text>
<text x="740" y="369" class="s" text-anchor="start">工时释放 → 单列容量与安排</text>
<text x="740" y="407" class="s" text-anchor="start">质量与风险改善 → 验证归因、避免重计</text>
<text x="60" y="486" class="m" text-anchor="start">同一范围与周期，逐期列增量现金流，再选择指标</text>
<rect x="60" y="512" width="305" height="144" rx="12" fill="#ffffff"/>
<text x="212" y="555" class="m" text-anchor="middle">简单项目 ROI</text>
<text x="212" y="598" class="s" text-anchor="middle">看累计回报比例</text>
<text x="212" y="634" class="n" text-anchor="middle">明确分母，不能当年化</text>
<rect x="385" y="512" width="305" height="144" rx="12" fill="#ffffff"/>
<text x="537" y="555" class="m" text-anchor="middle">静态回收期</text>
<text x="537" y="598" class="s" text-anchor="middle">看何时收回初始投入</text>
<text x="537" y="634" class="n" text-anchor="middle">不反映回收后的收益</text>
<rect x="710" y="512" width="305" height="144" rx="12" fill="#ffffff"/>
<text x="862" y="555" class="m" text-anchor="middle">净现值 NPV</text>
<text x="862" y="598" class="s" text-anchor="middle">考虑现金流时间价值</text>
<text x="862" y="634" class="n" text-anchor="middle">口径与折现率须一致</text>
<rect x="1035" y="512" width="305" height="144" rx="12" fill="#ffffff"/>
<text x="1187" y="555" class="m" text-anchor="middle">敏感性分析</text>
<text x="1187" y="598" class="s" text-anchor="middle">改变关键参数再计算</text>
<text x="1187" y="634" class="n" text-anchor="middle">找出结论的转换点</text>
<rect x="60" y="688" width="1280" height="207" rx="12" fill="#e5edf5"/>
<text x="85" y="733" class="m" text-anchor="start">假设练习：期初60万元，年运营12万元，年收益42万元，持续3年</text>
<text x="85" y="778" class="s" text-anchor="start">基准：简单 ROI 31.25%  |  静态回收期 2年  |  NPV 17.31万元（8%折现）</text>
<text x="85" y="821" class="s" text-anchor="start">年收益低20%：简单 ROI 仍为5%，但 NPV 降至 −4.33万元。</text>
<text x="85" y="862" class="n" text-anchor="start">计算口径和假设见案例；以上并非本公司数据，8%并非推荐折现率。</text>
<text x="60" y="949" class="s" text-anchor="start">汇报输出：推荐方案 + 总投入 + 收益证据 + 实现时间 + 关键假设 + 验证安排</text>
</svg>