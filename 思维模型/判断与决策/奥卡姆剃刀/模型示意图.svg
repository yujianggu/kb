<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">奥卡姆剃刀示意图</title><desc id="desc">不必要的假设可以剔除；关键事实不能删掉</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">奥卡姆剃刀</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用知识示意 · 未与视频内容核对</text><rect x="45" y="145" width="360" height="90" rx="16" fill="#dff2e7"/><text x="225.0" y="190.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">解释甲</text><text x="225.0" y="224.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">较少附加假设</text><rect x="45" y="285" width="360" height="90" rx="16" fill="#fff0d8"/><text x="225.0" y="330.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">解释乙</text><text x="225.0" y="364.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">更多附加假设</text><rect x="535" y="200" width="375" height="130" rx="16" fill="#dceefa"/><text x="722.5" y="265.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">先比较证据与解释范围</text><text x="722.5" y="299.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">条件相当才偏好简约</text><path d="M405 190 L523 235" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><path d="M405 330 L523 292" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">不必要的假设可以剔除；关键事实不能删掉</text></g></svg>