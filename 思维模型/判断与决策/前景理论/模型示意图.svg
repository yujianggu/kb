<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">前景理论示意图</title><desc id="desc">示意概念；无固定倍数，不保证收益。损失感受；参照点；收益感受</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#4f6984" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f4f7fb"/><text x="480" y="52" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" fill="#172b44">前景理论</text><text x="480" y="90" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#52657a">通用知识整理 · 概念关系示意</text><rect x="70" y="193" width="275" height="104" rx="15" fill="#ffe6df" stroke="#a7bed3"/><text x="207.5" y="254.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">损失感受</text><rect x="390" y="205" width="180" height="80" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="480.0" y="254.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">参照点</text><rect x="615" y="193" width="275" height="104" rx="15" fill="#dcefe8" stroke="#a7bed3"/><text x="752.5" y="254.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">收益感受</text><path d="M390 250 L355 250" stroke="#4f6984" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M575 250 L605 250" stroke="#4f6984" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="480" y="353" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#172b44">相对基准的变化影响感受</text><text x="480" y="452" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#40566d">示意概念；无固定倍数，不保证收益</text></svg>