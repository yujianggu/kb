<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">沉没成本示意图</title><desc id="desc">旧投入供复盘；未来差异用于选择。过去不可收回；未来会变化</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#4f6984" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f4f7fb"/><text x="480" y="52" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" fill="#172b44">沉没成本</text><text x="480" y="90" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#52657a">通用知识整理 · 概念关系示意</text><rect x="70" y="177" width="365" height="130" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="252.5" y="251.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">过去不可收回</text><rect x="525" y="177" width="365" height="130" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="707.5" y="251.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">未来会变化</text><text x="480" y="258" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="38" fill="#172b44">｜</text><text x="480" y="360" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#172b44">先核对事实与条件，再作判断</text><text x="480" y="452" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#40566d">旧投入供复盘；未来差异用于选择</text></svg>