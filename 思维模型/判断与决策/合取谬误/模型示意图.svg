<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">合取谬误：联合事件包含在单项事件里</title><desc id="desc">相同样本空间与已知信息；不要求 A 与 B 独立</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677e"/></marker></defs><rect width="960" height="520" rx="20" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172b45"><text x="40" y="52" font-size="30" fill="#172b45" text-anchor="start" font-weight="650">合取谬误：联合事件包含在单项事件里</text><text x="40" y="88" font-size="18" fill="#53677e" text-anchor="start">相同样本空间与已知信息；不要求 A 与 B 独立</text><text x="40" y="493" font-size="16" fill="#53677e" text-anchor="start">知识库原创概念图 · 通用知识版 · 尚未与视频内容核对</text><rect x="55" y="130" width="480" height="315" rx="22" fill="#e4f1ff" stroke="#86aacf" stroke-width="2"/><text x="85" y="177" font-size="24" fill="#172b45" text-anchor="start" font-weight="650">事件 A：项目按期上线</text><rect x="120" y="245" width="350" height="135" rx="16" fill="#dcf4ed" stroke="#c5d2e0"/><text x="295.0" y="281" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">A ∩ B</text><text x="295.0" y="315" font-size="19" fill="#172b45" text-anchor="middle">按期上线 且 不超预算</text><text x="740" y="230" font-size="25" fill="#172b45" text-anchor="middle" font-weight="650">P(A ∩ B) ≤ P(A)</text><text x="740" y="285" font-size="21" fill="#172b45" text-anchor="middle">增加条件，范围不会更大</text><text x="740" y="339" font-size="21" fill="#172b45" text-anchor="middle">也有 P(A ∩ B) ≤ P(B)</text></g></svg>
