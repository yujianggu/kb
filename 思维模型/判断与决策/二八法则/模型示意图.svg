<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">二八法则示意图</title><desc id="desc">柱高仅为示意；不是固定的 20% 与 80% 数学规律</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">二八法则</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用知识示意 · 未与视频内容核对</text><text x="285" y="122" text-anchor="middle" fill="#18324a" font-size="24" font-weight="600">按同一种影响指标排序</text><path d="M85 371 L510 371" fill="none" stroke="#54788e" stroke-width="2"/><rect x="110" y="180" width="52" height="190" rx="4" fill="#dff2e7"/><text x="136" y="401" text-anchor="middle" fill="#18324a" font-size="22" font-weight="400">甲</text><rect x="190" y="238" width="52" height="132" rx="4" fill="#dff2e7"/><text x="216" y="401" text-anchor="middle" fill="#18324a" font-size="22" font-weight="400">乙</text><rect x="270" y="296" width="52" height="74" rx="4" fill="#dceefa"/><text x="296" y="401" text-anchor="middle" fill="#18324a" font-size="22" font-weight="400">丙</text><rect x="350" y="328" width="52" height="42" rx="4" fill="#dceefa"/><text x="376" y="401" text-anchor="middle" fill="#18324a" font-size="22" font-weight="400">丁</text><rect x="430" y="347" width="52" height="23" rx="4" fill="#dceefa"/><text x="456" y="401" text-anchor="middle" fill="#18324a" font-size="22" font-weight="400">戊</text><rect x="585" y="152" width="300" height="90" rx="16" fill="#fff0d8"/><text x="735.0" y="197.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">观察贡献集中程度</text><text x="735.0" y="231.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">比例由真实数据决定</text><rect x="585" y="286" width="300" height="90" rx="16" fill="#dceefa"/><text x="735.0" y="331.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">再查原因与风险</text><text x="735.0" y="365.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">排序不等于因果</text><path d="M735 242 L735 275" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">柱高仅为示意；不是固定的 20% 与 80% 数学规律</text></g></svg>