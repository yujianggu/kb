<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img">
<title>安全边际思维模型示意图</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#42667a"/></marker></defs>
<rect width="960" height="480" fill="#f7fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="480" y="47" font-size="31" text-anchor="middle" fill="#19354b">安全边际思维模型</text>
<text x="480" y="80" font-size="19" text-anchor="middle" fill="#19354b">日常容量类比：预计需求与可用边界之间保留余量</text>
<rect x="90" y="180" width="520" height="110" fill="#c8dff0"/><rect x="610" y="180" width="240" height="110" fill="#d5ece0"/><path d="M850 145 V325" stroke="#ae6042" stroke-width="4"/>
<text x="350" y="245" font-size="29" text-anchor="middle" fill="#19354b">预计需求</text>
<text x="730" y="230" font-size="29" text-anchor="middle" fill="#19354b">余量</text>
<text x="730" y="266" font-size="20" text-anchor="middle" fill="#19354b">吸收部分偏差</text>
<text x="805" y="125" font-size="24" text-anchor="middle" fill="#19354b">可用边界</text>
<text x="480" y="365" font-size="25" text-anchor="middle" fill="#19354b">先明确约束与不确定性，再讨论需要多少缓冲</text>
<text x="480" y="447" font-size="20" text-anchor="middle" fill="#19354b">仅示意，不代表通用比例，也不保证投资收益或零风险</text>
</g>
</svg>