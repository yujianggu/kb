<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">第一性原理示意图</title><desc id="desc">拆出前提，再重新构造；基础判断仍要接受检验</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">第一性原理</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用知识示意 · 未与视频内容核对</text><rect x="45" y="190" width="205" height="110" rx="16" fill="#dceefa"/><text x="147.5" y="245.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">目标结果</text><text x="147.5" y="279.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">不先绑定方案</text><rect x="320" y="122" width="245" height="100" rx="16" fill="#dff2e7"/><text x="442.5" y="172.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">事实与真实约束</text><text x="442.5" y="206.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">保留必要条件</text><rect x="320" y="278" width="245" height="100" rx="16" fill="#fff0d8"/><text x="442.5" y="328.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">习惯与假设</text><text x="442.5" y="362.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">明确哪些可检验</text><rect x="650" y="190" width="250" height="110" rx="16" fill="#dceefa"/><text x="775.0" y="245.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">重建并试验</text><text x="775.0" y="279.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">用结果修正前提</text><path d="M250 224 L308 170" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><path d="M250 268 L308 328" fill="none" stroke="#54788e" stroke-width="