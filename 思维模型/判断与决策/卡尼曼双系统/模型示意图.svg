<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">卡尼曼双系统示意图</title><desc id="desc">快速直觉；风险检查；证据核验；形成决定。本库绘制的概念示意。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#48728a" stroke-width="1.5"/></marker></defs><rect width="960" height="480" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172c40"><text x="48" y="58" font-size="32" font-weight="700">卡尼曼双系统</text><rect x="100" y="140" width="300" height="120" rx="14" fill="#e1eef8" stroke="#93b5ca" stroke-width="2"/><text x="250.0" y="208.0" text-anchor="middle" font-size="24" fill="#172c40">快速直觉</text><text x="250" y="292" text-anchor="middle" font-size="20" fill="#172c40">自动、联想、熟练反应</text><rect x="560" y="140" width="300" height="120" rx="14" fill="#e1eef8" stroke="#93b5ca" stroke-width="2"/><text x="710.0" y="208.0" text-anchor="middle" font-size="24" fill="#172c40">证据核验</text><text x="710" y="292" text-anchor="middle" font-size="20" fill="#172c40">注意、计算、核对前提</text><line x1="400" y1="198" x2="548" y2="198" stroke="#48728a" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="155" text-anchor="middle" font-size="20" fill="#172c40">风险检查</text><rect x="300" y="345" width="360" height="65" rx="14" fill="#e1eef8" stroke="#93b5ca" stroke-width="2"/><text x="480.0" y="385.5" text-anchor="middle" font-size="24" fill="#172c40">形成决定</text><text x="480" y="443" text-anchor="middle" font-size="22" fill="#172c40">两种加工方式，不是两个独立脑区</text></g></svg>