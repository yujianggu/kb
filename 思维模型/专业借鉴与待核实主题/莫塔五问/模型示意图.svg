<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">莫塔五问示意图</title><desc id="desc">专业推理检查；不替代诊断与评估。最可能；不可遗漏；常见陷阱；伪装因素；未说清的议题</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#4f6984" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f4f7fb"/><text x="480" y="52" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" fill="#172b44">莫塔五问</text><text x="480" y="90" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#52657a">通用知识整理 · 概念关系示意</text><rect x="40" y="193" width="166" height="112" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="123.0" y="258.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">最可能</text><rect x="225" y="193" width="166" height="112" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="308.0" y="258.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">不可遗漏</text><rect x="410" y="193" width="166" height="112" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="493.0" y="258.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">常见陷阱</text><rect x="595" y="193" width="166" height="112" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="678.0" y="258.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">伪装因素</text><rect x="780" y="193" width="166" height="112" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="863.0" y="258.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">未说清的议题</text><text x="480" y="355" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#172b44">五个互补视角，避免过早结束判