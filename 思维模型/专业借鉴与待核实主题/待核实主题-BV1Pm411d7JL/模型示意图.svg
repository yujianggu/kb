<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">励志公式：先检查假设</title><desc id="desc">公式演算正确，不等于真实学习按此增长</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677e"/></marker></defs><rect width="960" height="520" rx="20" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172b45"><text x="40" y="52" font-size="30" fill="#172b45" text-anchor="start" font-weight="650">励志公式：先检查假设</text><text x="40" y="88" font-size="18" fill="#53677e" text-anchor="start">公式演算正确，不等于真实学习按此增长</text><text x="40" y="493" font-size="16" fill="#53677e" text-anchor="start">通用主题参考，非作者模型原图</text><rect x="45" y="145" width="390" height="120" rx="16" fill="#e4f1ff" stroke="#c5d2e0"/><text x="240.0" y="181" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">数学模型</text><text x="240.0" y="215" font-size="19" fill="#172b45" text-anchor="middle">Q(n) = Q(0) × (1+r)ⁿ</text><text x="240.0" y="242" font-size="19" fill="#172b45" text-anchor="middle">前提：每期同一比例增长</text><rect x="525" y="145" width="390" height="120" rx="16" fill="#fff0ce" stroke="#c5d2e0"/><text x="720.0" y="181" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">真实学习</text><text x="720.0" y="215" font-size="19" fill="#172b45" text-anchor="middle">变量如何测量？</text><text x="720.0" y="242" font-size="19" fill="#172b45" text-anchor="middle">增长率与保留率会变化</text><path d="M445 205 L515 205" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="310" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">需要检验前提，不能直接等同</text><rect x="145" y="350" width="670" height="90" rx="16" fill="#dcf4ed" stroke="#c5d2e0"/><text x="480.0" y="386" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">练习 → 反馈 → 调整方法</text></g></svg>
