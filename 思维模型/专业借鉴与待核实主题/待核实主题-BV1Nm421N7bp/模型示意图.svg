<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">晋升与岗位适配</title><desc id="desc">彼得原理相关主题；原标题未确认模型名</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677e"/></marker></defs><rect width="960" height="520" rx="20" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172b45"><text x="40" y="52" font-size="30" fill="#172b45" text-anchor="start" font-weight="650">晋升与岗位适配</text><text x="40" y="88" font-size="18" fill="#53677e" text-anchor="start">彼得原理相关主题；原标题未确认模型名</text><text x="40" y="493" font-size="16" fill="#53677e" text-anchor="start">通用主题参考，非作者模型原图</text><rect x="45" y="155" width="365" height="145" rx="16" fill="#e4f1ff" stroke="#c5d2e0"/><text x="227.5" y="191" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">当前岗位证据</text><text x="227.5" y="225" font-size="19" fill="#172b45" text-anchor="middle">个人交付 / 熟练操作</text><text x="227.5" y="252" font-size="19" fill="#172b45" text-anchor="middle">旧岗位成功方式</text><rect x="550" y="155" width="365" height="145" rx="16" fill="#fff0ce" stroke="#c5d2e0"/><text x="732.5" y="191" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">下一岗位要求</text><text x="732.5" y="225" font-size="19" fill="#172b45" text-anchor="middle">指导 / 分工 / 协调</text><text x="732.5" y="252" font-size="19" fill="#172b45" text-anchor="middle">可能需要新增能力</text><path d="M420 225 L540 225" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="140" font-size="18" fill="#172b45" text-anchor="middle">不自动证明</text><rect x="160" y="355" width="640" height="90" rx="16" fill="#dcf4ed" stroke="#c5d2e0"/><text x="480.0" y="391" font-size="21" fill="#172b45" text-anchor="middle" font-weight="650">比较任务 → 提供支持 → 按相关证据复盘</text><path d="M230 310 L330 347" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M730 310 L630 347" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>
