<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img">
<title>断裂点理论思维模型示意图</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#42667a"/></marker></defs>
<rect width="960" height="480" fill="#f7fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="480" y="47" font-size="31" text-anchor="middle" fill="#19354b">断裂点理论思维模型</text>
<text x="480" y="80" font-size="19" text-anchor="middle" fill="#19354b">通用主题参考，非作者模型原图</text>
<rect x="40" y="155" width="250" height="130" rx="16" fill="#e1f0ef" stroke="#9eb8c4"/>
<text x="165.0" y="191" font-size="26" text-anchor="middle" fill="#19354b">正常运行</text>
<text x="165.0" y="223" font-size="20" text-anchor="middle" fill="#19354b">持续观察异常</text>
<rect x="355" y="155" width="250" height="130" rx="16" fill="#fcebdc" stroke="#9eb8c4"/>
<text x="480.0" y="191" font-size="26" text-anchor="middle" fill="#19354b">达到暂停条件</text>
<text x="480.0" y="223" font-size="20" text-anchor="middle" fill="#19354b">隔离故障、保留服务</text>
<rect x="670" y="155" width="250" height="130" rx="16" fill="#e7edf8" stroke="#9eb8c4"/>
<text x="795.0" y="191" font-size="26" text-anchor="middle" fill="#19354b">有限恢复试探</text>
<text x="795.0" y="223" font-size="20" text-anchor="middle" fill="#19354b">先验证，再逐步恢复</text>
<path d="M290 220 L349 220" fill="none" stroke="#42667a" stroke-width="3" marker-end="url(#a)"/>
<path d="M605 220 L664 220" fill="none" stroke="#42667a" stroke-width="3" marker-end="url(#a)"/>
<path d="M790 290 V350 H170 V290" fill="none" stroke="#42667a" stroke-width="3" marker-end="url(#a)"/>
<text x="480" y="386" font-size="24" text-anchor="middle" fill="#19354b">恢复成功回到正常；失败则再次暂停</text>
<text x="480" y="447" font-size="20" text-anchor="middle" fill="#19354b">本图演示熔断与故障隔离，不认定题名的作者定义</text>
</g>
</svg>