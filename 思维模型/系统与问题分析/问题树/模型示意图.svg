<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">问题树示意图</title><desc id="desc">采用因果问题树：原因 → 核心问题 → 后果；不等于证据</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">问题树</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用知识示意 · 未与视频内容核对</text><rect x="340" y="105" width="280" height="70" rx="16" fill="#fff0d8"/><text x="480.0" y="148.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">后果：资源闲置</text><rect x="320" y="228" width="320" height="76" rx="16" fill="#dceefa"/><text x="480.0" y="274.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">核心问题：报名不足</text><rect x="100" y="351" width="310" height="64" rx="16" fill="#dff2e7"/><text x="255.0" y="391.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">可能原因：触达不足</text><rect x="550" y="351" width="310" height="64" rx="16" fill="#dff2e7"/><text x="705.0" y="391.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">可能原因：操作困难</text><path d="M480 228 L480 185" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><path d="M255 351 L373 314" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><path d="M705 351 L587 314" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><text x="790" y="263" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">连线待验证</text><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">采用因果问题树：原因 → 核心问题 → 后果；不等于证据</text></g></svg>