<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">系统思维示意图</title><desc id="desc">存量变化取决于流入与流出；反馈会改变后续流量。流入；存量；流出；反馈决策</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4776a4"/></marker></defs><rect width="960" height="480" rx="22" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="480" y="57" font-size="34" text-anchor="middle" fill="#172b4d">系统思维</text><rect x="70" y="145" width="200" height="85" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="170.0" y="196.5" font-size="27" text-anchor="middle" fill="#172b4d">流入</text><rect x="380" y="145" width="200" height="85" rx="16" fill="#dcefe7" stroke="#b8cadf"/><text x="480.0" y="196.5" font-size="27" text-anchor="middle" fill="#172b4d">存量</text><rect x="690" y="145" width="200" height="85" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="790.0" y="196.5" font-size="27" text-anchor="middle" fill="#172b4d">流出</text><path d="M275 187 L365 187" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M585 187 L675 187" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="330" y="310" width="300" height="75" rx="16" fill="#fff0d6" stroke="#b8cadf"/><text x="480.0" y="356.5" font-size="27" text-anchor="middle" fill="#172b4d">反馈决策</text><path d="M480 235 L480 295" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M330 347 L170 347 L170 245" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="480" y="445" font-size="22" text-anchor="middle" fill="#172b4d">存量变化取决于流入与流出；反馈会改变后续流量</text></g></svg>