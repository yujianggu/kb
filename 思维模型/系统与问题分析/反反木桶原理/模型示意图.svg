<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">反反木桶原理示意图</title><desc id="desc">观察整体产出，不只看局部强弱。输入能力充足；当前约束；后续交付</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#4f6984" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f4f7fb"/><text x="480" y="52" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" fill="#172b44">反反木桶原理</text><text x="480" y="90" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#52657a">通用主题参考，非作者模型原图</text><rect x="65" y="190" width="230" height="105" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="180.0" y="251.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">输入能力充足</text><rect x="370" y="190" width="230" height="105" rx="15" fill="#ffe5c9" stroke="#a7bed3"/><text x="485.0" y="251.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">当前约束</text><rect x="675" y="190" width="230" height="105" rx="15" fill="#e2edf9" stroke="#a7bed3"/><text x="790.0" y="251.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#172b44">后续交付</text><path d="M301 242 L360 242" stroke="#4f6984" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M606 242 L665 242" stroke="#4f6984" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="480" y="353" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#172b44">先改善真正限制交付的环节</text><text x="480" y="452" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#40566d">观察整体产出，不只看局部强弱</text></svg>