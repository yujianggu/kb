<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">路径依赖示意图</title><desc id="desc">解释强化机制，不等于旧路必错，也不等于无法转向</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">路径依赖</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用知识示意 · 未与视频内容核对</text><rect x="55" y="180" width="210" height="110" rx="16" fill="#dceefa"/><text x="160.0" y="235.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">早期选择</text><text x="160.0" y="269.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">当时条件</text><rect x="350" y="180" width="250" height="110" rx="16" fill="#dff2e7"/><text x="475.0" y="235.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">积累配套与经验</text><text x="475.0" y="269.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">学习 · 兼容 · 网络</text><rect x="685" y="180" width="225" height="110" rx="16" fill="#fff0d8"/><text x="797.5" y="235.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">继续沿用</text><text x="797.5" y="269.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">转换成本改变</text><path d="M265 235 L338 235" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><path d="M600 235 L673 235" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><path d="M800 290 L800 363 L475 363 L475 302" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><text x="630" y="395" text-anchor="middle" fill="#18324a" font-size="22" font-weight="400">可能形成自我强化</text><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">解释强化机制，不等于旧路必错，也不等于无法转向</text></g></svg>