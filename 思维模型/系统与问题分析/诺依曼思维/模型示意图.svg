<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">分解、接口、组合验证</title><desc id="desc">“诺依曼思维”原义待核实；不作人物归属</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677e"/></marker></defs><rect width="960" height="520" rx="20" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172b45"><text x="40" y="52" font-size="30" fill="#172b45" text-anchor="start" font-weight="650">分解、接口、组合验证</text><text x="40" y="88" font-size="18" fill="#53677e" text-anchor="start">“诺依曼思维”原义待核实；不作人物归属</text><text x="40" y="493" font-size="16" fill="#53677e" text-anchor="start">通用主题参考，非作者模型原图</text><rect x="295" y="125" width="370" height="90" rx="16" fill="#e4f1ff" stroke="#c5d2e0"/><text x="480.0" y="161" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">整体目标</text><text x="480.0" y="195" font-size="19" fill="#172b45" text-anchor="middle">外部结果与约束</text><rect x="50" y="280" width="260" height="95" rx="16" fill="#dcf4ed" stroke="#c5d2e0"/><text x="180.0" y="316" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">模块 A</text><text x="180.0" y="350" font-size="19" fill="#172b45" text-anchor="middle">输入 / 输出</text><rect x="350" y="280" width="260" height="95" rx="16" fill="#dcf4ed" stroke="#c5d2e0"/><text x="480.0" y="316" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">模块 B</text><text x="480.0" y="350" font-size="19" fill="#172b45" text-anchor="middle">输入 / 输出</text><rect x="650" y="280" width="260" height="95" rx="16" fill="#dcf4ed" stroke="#c5d2e0"/><text x="780.0" y="316" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">模块 C</text><text x="780.0" y="350" font-size="19" fill="#172b45" text-anchor="middle">输入 / 输出</text><path d="M480 223 V245 H180 V273" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 223 L480 273" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 245 H780 V273" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M316 329 L343 329" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M616 329 L643 329" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="427" font-size="22" fill="#172b45" text-anchor="middle">局部通过 ≠ 整体通过；接口与异常路径也要检查</text></g></svg>
