<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">SECI模型示意图</title><desc id="desc">S 隐性 → 隐性；E 隐性 → 显性；C 显性 → 显性；I 显性 → 隐性。概念示意，非统计图。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#486478" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f3f7fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#19354a"><text x="40" y="56" font-size="32" font-weight="700">SECI模型</text><rect x="115" y="132" width="280" height="90" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="255.0" y="186.0" font-size="24" text-anchor="middle">S 隐性 → 隐性</text><rect x="565" y="132" width="280" height="90" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="705.0" y="186.0" font-size="24" text-anchor="middle">E 隐性 → 显性</text><rect x="565" y="302" width="280" height="90" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="705.0" y="356.0" font-size="24" text-anchor="middle">C 显性 → 显性</text><rect x="115" y="302" width="280" height="90" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="255.0" y="356.0" font-size="24" text-anchor="middle">I 显性 → 隐性</text><path d="M410 177 L548 177" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><path d="M705 235 L705 286" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><path d="M548 347 L410 347" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><path d="M255 286 L255 235" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="265" font-size="22" text-anchor="middle">反复互动</text></g></svg>