<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">多环集合思维示意图</title><desc id="desc">满足 A；同时满足；满足 B。概念示意，非统计图。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#486478" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f3f7fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#19354a"><text x="40" y="56" font-size="32" font-weight="700">多环集合思维</text><text x="480" y="97" font-size="20" text-anchor="middle">通用主题参考，非作者模型原图</text><circle cx="385" cy="265" r="130" fill="#8abade" fill-opacity=".42" stroke="#487ca2" stroke-width="3"/><circle cx="575" cy="265" r="130" fill="#93cfb1" fill-opacity=".42" stroke="#468562" stroke-width="3"/><text x="330" y="265" font-size="24" text-anchor="middle">满足 A</text><text x="480" y="250" font-size="21" text-anchor="middle">同时</text><text x="480" y="282" font-size="21" text-anchor="middle">满足</text><text x="630" y="265" font-size="24" text-anchor="middle">满足 B</text><text x="480" y="430" font-size="22" text-anchor="middle">交集表示“同时满足”；面积不代表数量</text></g></svg>