<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">大道至简示意图</title><desc id="desc">原流程：必要＋重复；简化：保留必要约束；检验任务是否更易完成。概念示意，非统计图。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#486478" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f3f7fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#19354a"><text x="40" y="56" font-size="32" font-weight="700">大道至简</text><text x="480" y="97" font-size="20" text-anchor="middle">通用主题参考，非作者模型原图</text><rect x="80" y="140" width="800" height="77" rx="14" fill="#f3dfd5" stroke="#8facbf"/><text x="480.0" y="187.5" font-size="24" text-anchor="middle">原流程：必要＋重复</text><rect x="80" y="242" width="800" height="77" rx="14" fill="#dceee4" stroke="#8facbf"/><text x="480.0" y="289.5" font-size="24" text-anchor="middle">简化：保留必要约束</text><path d="M480 221 L480 235" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="380" font-size="24" text-anchor="middle">检验任务是否更易完成</text><text x="480" y="433" font-size="22" text-anchor="middle">更短不必然更易用</text></g></svg>