<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">MECE原则示意图</title><desc id="desc">示例状态需有清楚定义；多标签分析可另设视图</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">MECE原则</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用知识示意 · 未与视频内容核对</text><text x="480" y="132" text-anchor="middle" fill="#18324a" font-size="26" font-weight="600">先定义全集：本月全部申请</text><rect x="100" y="170" width="760" height="205" rx="12" fill="#ffffff"/><rect x="115" y="186" width="233" height="169" rx="6" fill="#dceefa"/><text x="231.5" y="273" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">待处理</text><rect x="359" y="186" width="233" height="169" rx="6" fill="#dff2e7"/><text x="475.5" y="273" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">已完成</text><rect x="603" y="186" width="242" height="169" rx="6" fill="#fff0d8"/><text x="724.0" y="273" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">已撤销</text><text x="480" y="411" text-anchor="middle" fill="#18324a" font-size="23" font-weight="400">同一统计时刻，每项只落一格，所有项都有位置</text><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">示例状态需有清楚定义；多标签分析可另设视图</text></g></svg>