<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">SCQA序言结构示意图</title><desc id="desc">序言建立问题；答案之后仍需理由与证据</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">SCQA序言结构</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用知识示意 · 未与视频内容核对</text><rect x="35" y="190" width="185" height="130" rx="16" fill="#dceefa"/><text x="127.5" y="255.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">S 背景</text><text x="127.5" y="289.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">共同起点</text><path d="M220 255 L255 255" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><rect x="270" y="190" width="185" height="130" rx="16" fill="#fff0d8"/><text x="362.5" y="255.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">C 变化</text><text x="362.5" y="289.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">出现缺口</text><path d="M455 255 L490 255" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><rect x="505" y="190" width="185" height="130" rx="16" fill="#dff2e7"/><text x="597.5" y="255.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">Q 问题</text><text x="597.5" y="289.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">需要回答什么</text><path d="M690 255 L725 255" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><rect x="740" y="190" width="185" height="130" rx="16" fill="#dceefa"/><text x="832.5" y="255.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">A 答案</text><text x="832.5" y="289.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">本次结论</text><text x="480" y="380" text-anchor="middle" fill="#18324a" font-size="24" font-weight="400">检查：变化是否引出问题？答案是否回应问题？</text><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">序言建立问题；答案之后仍需理由与证据</text></g></svg>