<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">TTT：培养能教会别人的培训者</title><desc id="desc">培训目标是学习与迁移，不只是展示与表达</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677e"/></marker></defs><rect width="960" height="520" rx="20" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172b45"><text x="40" y="52" font-size="30" fill="#172b45" text-anchor="start" font-weight="650">TTT：培养能教会别人的培训者</text><text x="40" y="88" font-size="18" fill="#53677e" text-anchor="start">培训目标是学习与迁移，不只是展示与表达</text><text x="40" y="493" font-size="16" fill="#53677e" text-anchor="start">知识库原创概念图 · 通用知识版 · 尚未与视频内容核对</text><rect x="75" y="135" width="320" height="120" rx="16" fill="#e4f1ff" stroke="#c5d2e0"/><text x="235.0" y="171" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">定义与示范</text><text x="235.0" y="205" font-size="19" fill="#172b45" text-anchor="middle">目标任务 / 合格表现</text><text x="235.0" y="232" font-size="19" fill="#172b45" text-anchor="middle">讲清判断与边界</text><rect x="565" y="135" width="320" height="120" rx="16" fill="#dcf4ed" stroke="#c5d2e0"/><text x="725.0" y="171" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">准讲师试教</text><text x="725.0" y="205" font-size="19" fill="#172b45" text-anchor="middle">讲解与带练</text><text x="725.0" y="232" font-size="19" fill="#172b45" text-anchor="middle">暴露遗漏和误解</text><rect x="565" y="305" width="320" height="120" rx="16" fill="#fff0ce" stroke="#c5d2e0"/><text x="725.0" y="341" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">学员实际操作</text><text x="725.0" y="375" font-size="19" fill="#172b45" text-anchor="middle">换一个情境检查</text><text x="725.0" y="402" font-size="19" fill="#172b45" text-anchor="middle">观察能否独立应用</text><rect x="75" y="305" width="320" heig