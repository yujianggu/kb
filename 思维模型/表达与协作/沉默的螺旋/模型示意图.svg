<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">沉默的螺旋示意图</title><desc id="desc">可能的强化回路；沉默原因需要另行核实。感到意见不被支持；担心表达代价；减少公开表达；异议更不显眼</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4776a4"/></marker></defs><rect width="960" height="480" rx="22" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="480" y="57" font-size="34" text-anchor="middle" fill="#172b4d">沉默的螺旋</text><rect x="90" y="125" width="300" height="95" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="240.0" y="181.5" font-size="26" text-anchor="middle" fill="#172b4d">感到意见不被支持</text><rect x="570" y="125" width="300" height="95" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="720.0" y="181.5" font-size="26" text-anchor="middle" fill="#172b4d">担心表达代价</text><rect x="570" y="295" width="300" height="95" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="720.0" y="351.5" font-size="26" text-anchor="middle" fill="#172b4d">减少公开表达</text><rect x="90" y="295" width="300" height="95" rx="16" fill="#e2eefb" stroke="#b8cadf"/><text x="240.0" y="351.5" font-size="26" text-anchor="middle" fill="#172b4d">异议更不显眼</text><path d="M395 172 L555 172" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M720 225 L720 280" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M565 342 L405 342" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M240 290 L240 235" stroke="#4776a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="480" y="263" font-size="26" text-anchor="middle" fill="#172b4d">反馈</text><text x="480" y="441" font-size="22" text-anchor="middle" fill="#172b4d">可能的强化回路；沉默原因需要另行核实</text></g></svg>