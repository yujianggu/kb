<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">首因效应示意图</title><desc id="desc">先到信息；初始框架；后续证据；重新校准。本库绘制的概念示意。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#48728a" stroke-width="1.5"/></marker></defs><rect width="960" height="480" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172c40"><text x="48" y="58" font-size="32" font-weight="700">首因效应</text><rect x="60" y="150" width="165" height="90" rx="14" fill="#b7d8eb" stroke="#93b5ca" stroke-width="2"/><text x="142.5" y="203.0" text-anchor="middle" font-size="24" fill="#172c40">开头信息</text><rect x="285" y="150" width="165" height="90" rx="14" fill="#e7eef3" stroke="#93b5ca" stroke-width="2"/><text x="367.5" y="203.0" text-anchor="middle" font-size="24" fill="#172c40">中间信息</text><rect x="510" y="150" width="165" height="90" rx="14" fill="#e7eef3" stroke="#93b5ca" stroke-width="2"/><text x="592.5" y="203.0" text-anchor="middle" font-size="24" fill="#172c40">后段信息</text><rect x="735" y="150" width="165" height="90" rx="14" fill="#e7eef3" stroke="#93b5ca" stroke-width="2"/><text x="817.5" y="203.0" text-anchor="middle" font-size="24" fill="#172c40">最新信息</text><line x1="142" y1="240" x2="480" y2="315" stroke="#48728a" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="330" width="380" height="70" rx="14" fill="#e1eef8" stroke="#93b5ca" stroke-width="2"/><text x="480.0" y="373.0" text-anchor="middle" font-size="24" fill="#172c40">评价应回到完整证据</text><text x="480" y="105" text-anchor="middle" font-size="22" fill="#172c40">位置影响可能存在，不等于证据权重</text><text x="480" y="462" text-anchor="middle" font-size="18" fill="#53687a">本库概念图 · 关系示意，不代表来源视频原图</text></g></svg>