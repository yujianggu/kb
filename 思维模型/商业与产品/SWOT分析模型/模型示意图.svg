<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">SWOT分析模型示意图</title><desc id="desc">先锁定同一个目标，再用证据填格并选择行动</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">SWOT分析模型</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用知识示意 · 未与视频内容核对</text><text x="320" y="118" text-anchor="middle" fill="#18324a" font-size="23" font-weight="400">有利于目标</text><text x="700" y="118" text-anchor="middle" fill="#18324a" font-size="23" font-weight="400">不利于目标</text><text x="78" y="210" text-anchor="middle" fill="#18324a" font-size="23" font-weight="400">内部</text><text x="78" y="340" text-anchor="middle" fill="#18324a" font-size="23" font-weight="400">外部</text><rect x="140" y="140" width="345" height="115" rx="16" fill="#dff2e7"/><text x="312.5" y="197.5" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">S 优势</text><text x="312.5" y="231.5" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">已有能力与资源</text><rect x="510" y="140" width="345" height="115" rx="16" fill="#fff0d8"/><text x="682.5" y="197.5" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">W 劣势</text><text x="682.5" y="231.5" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">内部限制与短板</text><rect x="140" y="275" width="345" height="115" rx="16" fill="#dceefa"/><text x="312.5" y="332.5" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">O 机会</text><text x="312.5" y="366.5" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">环境中的有利条件</text><rect x="510" y="275" width="345" height="115" rx="16" fill="#fbe1e1"/><text x="682.5" y="332.5" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">T 威胁</text><text x="682.5" y="366.5" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">环境中的不利条件</text><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">先锁定同一个目标，再用证据填格并选择行动</text></g></svg>