<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">波士顿矩阵示意图</title><desc id="desc">象限用于初筛；现金流、协同与退出成本另行核对</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">波士顿矩阵</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用知识示意 · 未与视频内容核对</text><text x="85" y="115" text-anchor="middle" fill="#18324a" font-size="20" font-weight="400">市场增长</text><text x="110" y="186" text-anchor="middle" fill="#18324a" font-size="22" font-weight="400">高</text><text x="110" y="323" text-anchor="middle" fill="#18324a" font-size="22" font-weight="400">低</text><rect x="150" y="130" width="330" height="120" rx="16" fill="#dff2e7"/><text x="315.0" y="190.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">明星</text><text x="315.0" y="224.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">高增长 · 高相对份额</text><rect x="500" y="130" width="330" height="120" rx="16" fill="#fff0d8"/><text x="665.0" y="190.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">问题业务</text><text x="665.0" y="224.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">高增长 · 低相对份额</text><rect x="150" y="265" width="330" height="120" rx="16" fill="#dceefa"/><text x="315.0" y="325.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">现金牛</text><text x="315.0" y="359.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">低增长 · 高相对份额</text><rect x="500" y="265" width="330" height="120" rx="16" fill="#fbe1e1"/><text x="665.0" y="325.0" text-anchor="middle" fill="#18324a" font-size="27