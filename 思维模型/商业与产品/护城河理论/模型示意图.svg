<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">护城河理论示意图</title><desc id="desc">客户选择；难复制的优势；持续经营回报；竞争与变化。本库绘制的概念示意。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#48728a" stroke-width="1.5"/></marker></defs><rect width="960" height="480" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172c40"><text x="48" y="58" font-size="32" font-weight="700">护城河理论</text><ellipse cx="480" cy="265" rx="330" ry="140" fill="#d7eaf3" stroke="#81afc6" stroke-width="3"/><rect x="340" y="210" width="280" height="95" rx="14" fill="#e1eef8" stroke="#93b5ca" stroke-width="2"/><text x="480.0" y="265.5" text-anchor="middle" font-size="24" fill="#172c40">持续经营回报</text><text x="480" y="160" text-anchor="middle" font-size="25" fill="#172c40">难复制的优势</text><text x="480" y="380" text-anchor="middle" font-size="23" fill="#172c40">客户选择</text><text x="800" y="110" text-anchor="middle" font-size="21" fill="#172c40">竞争与变化</text><line x1="792" y1="128" x2="715" y2="181" stroke="#48728a" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="435" text-anchor="middle" font-size="22" fill="#172c40">优势需要持续证据；不保证投资收益</text></g></svg>