<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img">
<title>波特五力模型示意图</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#42667a"/></marker></defs>
<rect width="960" height="480" fill="#f7fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="480" y="47" font-size="31" text-anchor="middle" fill="#19354b">波特五力模型</text>
<text x="480" y="80" font-size="19" text-anchor="middle" fill="#19354b">通用知识示意 · 尚未与视频内容核对</text>
<rect x="340" y="210" width="280" height="95" rx="16" fill="#e1f0ef" stroke="#9eb8c4"/>
<text x="480.0" y="246" font-size="26" text-anchor="middle" fill="#19354b">现有竞争</text>
<text x="480.0" y="278" font-size="20" text-anchor="middle" fill="#19354b">行业内争夺</text>
<rect x="340" y="100" width="280" height="85" rx="16" fill="#e7edf8" stroke="#9eb8c4"/>
<text x="480.0" y="136" font-size="26" text-anchor="middle" fill="#19354b">进入威胁</text>
<text x="480.0" y="168" font-size="20" text-anchor="middle" fill="#19354b">新参与者</text>
<rect x="340" y="330" width="280" height="85" rx="16" fill="#fcebdc" stroke="#9eb8c4"/>
<text x="480.0" y="366" font-size="26" text-anchor="middle" fill="#19354b">替代威胁</text>
<text x="480.0" y="398" font-size="20" text-anchor="middle" fill="#19354b">另一种解决方式</text>
<rect x="35" y="215" width="250" height="100" rx="16" fill="#e7edf8" stroke="#9eb8c4"/>
<text x="160.0" y="251" font-size="26" text-anchor="middle" fill="#19354b">供应商议价</text>
<text x="160.0" y="283" font-size="20" text-anchor="middle" fill="#19354b">关键投入控制力</text>
<rect x="675" y="215" width="250" height="100" rx="16" fill="#fcebdc" stroke="#9eb8c4"/>
<text x="800.0" y="251" font-size="26" text-anchor="middle" fill="#19354b">买方议价</text>
<text x="800.0" y="283" font-size="20" text-anchor="middle" fill="#19354b">选择与谈判空间</text>
<path d="M480 190 L480 205" fill="none" stroke="#42667a" stroke-width="3" marker-end="url(#a)"/>
<path d="M480 325 L480 310" fill="none" stroke="#42667a" stroke-width="3" marker-end="url(#a)"/>
<path d="M290 260 L335 260" fill="none" stroke="#42667a" stroke-width="3" marker-end="url(#a)"/>
<path d="M670 260 L625 260" fill="none" stroke="#42667a" stroke-width="3" marker-end="url(#a)"/>
<text x="480" y="447" font-size="20" text-anchor="middle" fill="#19354b">先定义行业边界；箭头表示结构压力，不是固定因果大小</text>
</g>
