<text x="765" y="335" font-size="25" text-anchor="middle" fill="#19354b">25%</text>
<text x="480" y="447" font-size="20" text-anchor="middle" fill="#19354b">40% × 25% = 10%；不同月份、不同队列不能混算</text>
