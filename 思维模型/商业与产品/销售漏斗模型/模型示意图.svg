<rect width="960" height="480" fill="#f7fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="480" y="47" font-size="31" text-anchor="middle" fill="#19354b">销售漏斗模型</text>
<text x="480" y="80" font-size="19" text-anchor="middle" fill="#19354b">同一批对象 · 顺序事件 · 相同观察窗口</text>
<path d="M125 115 H835 L803 187 H157 Z" fill="#dcefeb" stroke="#91b9b4"/>
