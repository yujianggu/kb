<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">SOLO分类理论示意图</title><desc id="desc">前结构；单点结构；多点结构；关联结构；拓展抽象。概念示意，非统计图。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#486478" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f3f7fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#19354a"><text x="40" y="56" font-size="32" font-weight="700">SOLO分类理论</text><rect x="40" y="285" width="160" height="74" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="120.0" y="331.0" font-size="24" text-anchor="middle">前结构</text><path d="M205 315 L218 292" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><rect x="220" y="253" width="160" height="74" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="300.0" y="299.0" font-size="24" text-anchor="middle">单点结构</text><path d="M385 283 L398 260" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="221" width="160" height="74" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="480.0" y="267.0" font-size="24" text-anchor="middle">多点结构</text><path d="M565 251 L578 228" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="189" width="160" height="74" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="660.0" y="235.0" font-size="24" text-anchor="middle">关联结构</text><path d="M745 219 L758 196" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="157" width="160" height="74" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="840.0" y="203.0" font-size="24" text-anchor="middle">拓展抽象</text><text x="480" y="420" font-size="22" text-anchor="middle">评价具体学习成果；不是固定的人的等级</text></g></svg>