<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">工作与恢复切换</title><desc id="desc">先辨认负荷，再观察恢复；没有统一最佳分钟数</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677e"/></marker></defs><rect width="960" height="520" rx="20" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172b45"><text x="40" y="52" font-size="30" fill="#172b45" text-anchor="start" font-weight="650">工作与恢复切换</text><text x="40" y="88" font-size="18" fill="#53677e" text-anchor="start">先辨认负荷，再观察恢复；没有统一最佳分钟数</text><text x="40" y="493" font-size="16" fill="#53677e" text-anchor="start">通用主题参考，非作者模型原图</text><rect x="45" y="170" width="250" height="130" rx="16" fill="#e4f1ff" stroke="#c5d2e0"/><text x="170.0" y="206" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">任务负荷</text><text x="170.0" y="240" font-size="19" fill="#172b45" text-anchor="middle">持续判断 / 久坐</text><text x="170.0" y="267" font-size="19" fill="#172b45" text-anchor="middle">标记任务停点</text><rect x="355" y="170" width="250" height="130" rx="16" fill="#dcf4ed" stroke="#c5d2e0"/><text x="480.0" y="206" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">恢复安排</text><text x="480.0" y="240" font-size="19" fill="#172b45" text-anchor="middle">暂离相同要求</text><text x="480.0" y="267" font-size="19" fill="#172b45" text-anchor="middle">选择可结束的活动</text><rect x="665" y="170" width="250" height="130" rx="16" fill="#fff0ce" stroke="#c5d2e0"/><text x="790.0" y="206" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">返回与检查</text><text x="790.0" y="240" font-size="19" fill="#172b45" text-anchor="middle">疲劳感是否改变？</text><text x="790.0" y="267" font-size="19" fill="#172b45" text-anchor="middle">实际质量是否改变？</text><path d="M300 235 L350 235" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M610 235 L660 235" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M790 310 V385 H170 V310" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="420" font-size="23" fill="#172b45" text-anchor="middle">结果不理想 → 调整任务与休息安排</text></g></svg>
