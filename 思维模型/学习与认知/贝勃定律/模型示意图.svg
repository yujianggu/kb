<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">重复刺激与反应变化</title><desc id="desc">习惯化相关主题；趋势示意，不是数据或普遍定律</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677e"/></marker></defs><rect width="960" height="520" rx="20" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172b45"><text x="40" y="52" font-size="30" fill="#172b45" text-anchor="start" font-weight="650">重复刺激与反应变化</text><text x="40" y="88" font-size="18" fill="#53677e" text-anchor="start">习惯化相关主题；趋势示意，不是数据或普遍定律</text><text x="40" y="493" font-size="16" fill="#53677e" text-anchor="start">通用主题参考，非作者模型原图</text><path d="M115 400 L560 400" fill="none" stroke="#53677e" stroke-width="2.5"/><path d="M115 400 L115 145" fill="none" stroke="#53677e" stroke-width="2.5"/><text x="120" y="132" font-size="19" fill="#172b45" text-anchor="start">反应强度</text><text x="355" y="439" font-size="19" fill="#172b45" text-anchor="middle">重复呈现次数</text><path d="M130 170 C200 245 225 305 315 331 S480 348 550 350" fill="none" stroke="#26775e" stroke-width="5"/><rect x="630" y="170" width="270" height="155" rx="16" fill="#fff0ce" stroke="#c5d2e0"/><text x="765.0" y="206" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">先排除其他解释</text><text x="765.0" y="240" font-size="19" fill="#172b45" text-anchor="middle">未看见 / 太疲劳</text><text x="765.0" y="267" font-size="19" fill="#172b45" text-anchor="middle">不相关 / 无法行动</text><text x="710" y="378" font-size="20" fill="#172b45" text-anchor="middle">间隔、情境与强度</text><text x="710" y="409" font-size="20" fill="#172b45" text-anchor="middle">都可能影响反应</text></g></svg>
