<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">普通投入，也能推进任务</title><desc id="desc">不把“次心流”定义为固定心理学等级</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677e"/></marker></defs><rect width="960" height="520" rx="20" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172b45"><text x="40" y="52" font-size="30" fill="#172b45" text-anchor="start" font-weight="650">普通投入，也能推进任务</text><text x="40" y="88" font-size="18" fill="#53677e" text-anchor="start">不把“次心流”定义为固定心理学等级</text><text x="40" y="493" font-size="16" fill="#53677e" text-anchor="start">通用主题参考，非作者模型原图</text><rect x="45" y="160" width="265" height="135" rx="16" fill="#e4f1ff" stroke="#c5d2e0"/><text x="177.5" y="196" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">任务太模糊</text><text x="177.5" y="230" font-size="19" fill="#172b45" text-anchor="middle">写清结果与结束标志</text><text x="177.5" y="257" font-size="19" fill="#172b45" text-anchor="middle">例：解释一个概念</text><rect x="348" y="160" width="265" height="135" rx="16" fill="#dcf4ed" stroke="#c5d2e0"/><text x="480.5" y="196" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">难度不合适</text><text x="480.5" y="230" font-size="19" fill="#172b45" text-anchor="middle">补提示 / 拆任务</text><text x="480.5" y="257" font-size="19" fill="#172b45" text-anchor="middle">或增加迁移要求</text><rect x="650" y="160" width="265" height="135" rx="16" fill="#fff0ce" stroke="#c5d2e0"/><text x="782.5" y="196" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">反馈看不见</text><text x="782.5" y="230" font-size="19" fill="#172b45" text-anchor="middle">做出产物并检查</text><text x="782.5" y="257" font-size="19" fill="#172b45" text-anchor="middle">不要只记录忙碌</text><path d="M180 308 L180 355" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 308 L480 355" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 308 L780 355" fill="none" stroke="#53677e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="100" y="365" width="760" height="80" rx="16" fill="#eee8ff" stroke="#c5d2e0"/><text x="480.0" y="401" font-size="23" fill="#172b45" text-anchor="middle" font-weight="650">分别检查：投入体验 与 实际结果</text></g></svg>
