<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">放大镜缩小镜思维示意图</title><desc id="desc">切换观察范围，为了更准确；不是淡化现实问题</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#54788e"/></marker></defs><rect width="960" height="480" fill="#f7f9fc"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" text-anchor="start" fill="#18324a" font-size="32" font-weight="700">放大镜缩小镜思维</text><text x="42" y="80" text-anchor="start" fill="#53697a" font-size="18" font-weight="400">通用主题参考，非作者模型原图</text><rect x="50" y="165" width="265" height="150" rx="16" fill="#dceefa"/><text x="182.5" y="240.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">靠近：具体事件</text><text x="182.5" y="274.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">事实与解释分开</text><rect x="645" y="165" width="265" height="150" rx="16" fill="#dff2e7"/><text x="777.5" y="240.0" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">拉远：完整背景</text><text x="777.5" y="274.0" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">时间范围与其他证据</text><rect x="360" y="310" width="240" height="95" rx="16" fill="#fff0d8"/><text x="480.0" y="365.5" text-anchor="middle" fill="#18324a" font-size="27" font-weight="600">准确判断与行动</text><path d="M315 270 L350 340" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><path d="M645 270 L610 340" fill="none" stroke="#54788e" stroke-width="3" marker-end="url(#a)"/><text x="480" y="190" text-anchor="middle" fill="#18324a" font-size="25" font-weight="600">同一事件</text><path d="M315 213 L645 213" fill="none" stroke="#54788e" stroke-width="2"/><text x="480" y="454" text-anchor="middle" fill="#53697a" font-size="21" font-weight="400">切换观察范围，为了更准确；不是淡化现实问题</text></g></svg>