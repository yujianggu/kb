<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">总观效应示意图</title><desc id="desc">局部处境；地球整体与相互依存；具体责任选择。概念示意，非统计图。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#486478" stroke-width="1.5"/></marker></defs><rect width="960" height="480" rx="24" fill="#f3f7fa"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#19354a"><text x="40" y="56" font-size="32" font-weight="700">总观效应</text><circle cx="480" cy="252" r="110" fill="#cce4ee" stroke="#699aae" stroke-width="3"/><text x="480" y="247" font-size="27" text-anchor="middle">地球整体</text><text x="480" y="285" font-size="23" text-anchor="middle">相互依存</text><rect x="35" y="210" width="225" height="86" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="147.5" y="262.0" font-size="24" text-anchor="middle">局部处境</text><rect x="700" y="210" width="225" height="86" rx="14" fill="#dcebf3" stroke="#8facbf"/><text x="812.5" y="262.0" font-size="24" text-anchor="middle">责任选择</text><path d="M275 253 L350 253" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><path d="M608 253 L685 253" fill="none" stroke="#486478" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="424" font-size="21" text-anchor="middle">右侧为日常类比，不保证复制太空体验</text></g></svg>