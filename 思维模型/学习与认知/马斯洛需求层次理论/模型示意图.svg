<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img">
<title>马斯洛需求层次理论示意图</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#42667a"/></marker></defs>
<rect width="960" height="480" fill="#f7fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="480" y="47" font-size="31" text-anchor="middle" fill="#19354b">马斯洛需求层次理论</text>
<text x="480" y="80" font-size="19" text-anchor="middle" fill="#19354b">经典五类需要；可同时存在，不是固定晋级台阶</text>
<rect x="25" y="150" width="170" height="150" rx="16" fill="#dcefeb" stroke="#9eb8c4"/>
<text x="110.0" y="186" font-size="26" text-anchor="middle" fill="#19354b">生理</text>
<text x="110.0" y="218" font-size="20" text-anchor="middle" fill="#19354b">基本生活条件</text>
<rect x="213" y="150" width="170" height="150" rx="16" fill="#e2eef4" stroke="#9eb8c4"/>
<text x="298.0" y="186" font-size="26" text-anchor="middle" fill="#19354b">安全</text>
<text x="298.0" y="218" font-size="20" text-anchor="middle" fill="#19354b">稳定与可预期</text>
<rect x="401" y="150" width="170" height="150" rx="16" fill="#dcefeb" stroke="#9eb8c4"/>
<text x="486.0" y="186" font-size="26" text-anchor="middle" fill="#19354b">归属</text>
<text x="486.0" y="218" font-size="20" text-anchor="middle" fill="#19354b">接纳与联系</text>
<rect x="589" y="150" width="170" height="150" rx="16" fill="#e2eef4" stroke="#9eb8c4"/>
<text x="674.0" y="186" font-size="26" text-anchor="middle" fill="#19354b">尊重</text>
<text x="674.0" y="218" font-size="20" text-anchor="middle" fill="#19354b">认可与自尊</text>
<rect x="777" y="150" width="170" height="150" rx="16" fill="#dcefeb" stroke="#9eb8c4"/>
<text x="862.0" y="186" font-size="26" text-anchor="middle" fill="#19354b">自我实现</text>
<text x="862.0" y="218" font-size="20" text-anchor="middle" fill="#19354b">发挥潜能</text>
<path d="M110 330 H850" stroke="#829dad" stroke-width="3"/>
<text x="480" y="375" font-size="26" text-anchor="middle" fill="#19354b">向当事人询问当前需要，再检验改动</text>
<text x="480" y="447" font-size="20" text-anchor="middle" fill="#19354b">图中排列仅用于阅读，不表示人人必须按顺序满足</text>
</g>
</svg>